<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARK · Board</title>
<meta name="description" content="Every coin launched through ARK, read from the chain.">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png?v=4"><link rel="icon" type="image/png" sizes="64x64" href="/img/icon-64.png?v=4"><link rel="apple-touch-icon" href="/img/icon-180.png">
<meta property="og:title" content="ARK · Board"><meta property="og:description" content="Every coin boards in pairs."><meta property="og:image" content="https://ark-eta-neon.vercel.app/img/og.png">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://ark-eta-neon.vercel.app/img/og.png">
<link rel="preload" href="/fonts/inter-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/ark.css?v=4">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<header class="nav"><div class="nav-in">
  <a class="brand" href="/" aria-label="ARK home">ARK</a>
  <nav class="links"><a href="/board" data-page="board">Board</a><a href="/launch" data-page="launch">Launch</a><a href="/#pairs">Pairs</a><a href="/#ark">$ARK</a><a href="/#how">How it works</a><a href="/docs" data-page="docs">Docs</a><a href="/#faq">FAQ</a></nav>
  <div class="nav-r"><button class="ca" id="caChip" hidden></button><button class="btn wbtn" id="wBtn">Connect</button><button class="burger" aria-label="Menu"><span></span></button></div>
</div></header>
<main>
<section class="lp">
  <div class="wrap">
    <div class="sec-h" style="margin-bottom:28px" data-r><span class="kick">Live from the chain</span><h1 class="h2">The board.</h1><p>Every coin launched through ARK, each one paired to $ARK. Refreshes every 15 seconds.</p></div>
    <div class="grid g4" style="margin-bottom:26px" data-stagger>
      <div class="stat card"><small>Aboard</small><b id="bsCoins">—</b></div>
      <div class="stat card"><small>$ARK locked in curves</small><b id="bsLocked">—</b></div>
      <div class="stat card"><small>Graduated</small><b id="bsGrad">—</b></div>
      <div class="stat card"><small>Fees to holders</small><b id="bsHold">—</b></div>
    </div>
    <div class="bar-ctl">
      <input class="inp" id="q" placeholder="Search ticker, name or address" aria-label="Search">
      <div class="seg" id="sort"><button class="on" data-s="mcap">Market cap</button><button data-s="new">Newest</button><button data-s="prog">Progress</button><button data-s="locked">$ARK locked</button></div>
      <div class="seg" id="filt"><button class="on" data-f="all">All</button><button data-f="ark">$ARK pairs</button><button data-f="other">Other pairs</button><button data-f="curve">On curve</button><button data-f="grad">Graduated</button></div>
      <div class="seg" id="view" style="margin-left:auto"><button class="on" data-v="grid">Cards</button><button data-v="table">Table</button></div>
    </div>
    <div id="list"></div>
  </div>
</section>
</main>
<footer class="foot">
  <div class="wrap">
    <div class="big-word" aria-hidden="true">ARK</div>
  </div>
</footer>
<script src="/vendor/solana-lite.js" defer></script>
<script type="module" src="/js/board.js?v=4"></script>
</body>
</html>
